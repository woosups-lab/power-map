name: 서버 멈춤 방지

# Supabase 무료 프로젝트는 1주일 동안 요청이 없으면 일시정지되므로 주 2회 가볍게 접속한다.
on:
  schedule:
    - cron: "0 0 * * 1,4"   # 월·목 09:00 (KST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 서버 접속
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/sites?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "응답 $code"
          test "$code" -lt 500
